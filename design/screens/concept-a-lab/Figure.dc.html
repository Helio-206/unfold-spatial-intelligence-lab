<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Figura — quatro barras</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<svg width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="Mecanismo de quatro barras em vista isométrica, montado ou explodido" style="display:block;overflow:visible">
<sc-for list="{{shapes}}" as="s" hint-placeholder-count="20">
<path d="{{s.d}}" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="{{s.sw}}" opacity="{{s.op}}" stroke-linejoin="round" stroke-linecap="round"/>
</sc-for>
<sc-for list="{{labels}}" as="l" hint-placeholder-count="4">
<g opacity="{{l.op}}">
<path d="{{l.line}}" fill="none" stroke="{{l.ink}}" stroke-width="1" opacity=".6"/>
<circle cx="{{l.px}}" cy="{{l.py}}" r="3" fill="{{l.ink}}"/>
<text x="{{l.tx}}" y="{{l.ty}}" text-anchor="{{l.anchor}}" font-family="'Geist Mono', monospace" font-size="12" fill="{{l.muted}}">{{l.name}}</text>
<text x="{{l.tx}}" y="{{l.ty2}}" text-anchor="{{l.anchor}}" font-family="'Geist Mono', monospace" font-size="13" fill="{{l.ink}}">{{l.value}}</text>
</g>
</sc-for>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"e":{"editor":"range","default":0,"min":0,"max":1,"step":0.01},"yaw":{"editor":"range","default":-28,"min":-180,"max":180,"step":1,"unit":"°"},"dark":{"editor":"boolean","default":false},"showLabels":{"editor":"boolean","default":true},"$preview":{"width":900,"height":640}}'>
class Component extends DCLogic {
renderVals() {
const e = Math.min(1, Math.max(0, this.props.e ?? 0));
const yaw = (this.props.yaw ?? -28) * Math.PI / 180;
const dark = !!this.props.dark;
const C = dark
? { top: '#262B33', side: '#12151A', line: '#F3F0E8', plate: '#171A1F', plateSide: '#0E1014', ink: '#F3F0E8', muted: '#9AA0A8', shadow: '#000000', sop: 0.55 }
: { top: '#FFFFFF', side: '#D9D4C9', line: '#0B0D10', plate: '#FBFAF6', plateSide: '#D2CCBF', ink: '#0B0D10', muted: '#585D64', shadow: '#0B0D10', sop: 0.10 };
const FOLD = '#FF5A1F', FOLDSIDE = '#C93A08';
const th = 1.15;
const A = [0, 0], D = [100, 0], B = [40 * Math.cos(th), 40 * Math.sin(th)];
const dx = D[0] - B[0], dy = D[1] - B[1], d = Math.hypot(dx, dy);
const a = (120 * 120 - 90 * 90 + d * d) / (2 * d);
const h = Math.sqrt(Math.max(0, 120 * 120 - a * a));
const mx = B[0] + a * dx / d, my = B[1] + a * dy / d;
const Cj = [mx - h * dy / d, my + h * dx / d];
const cx0 = 62, cy0 = 38, S = 3, ox = 450, oy = 410 - e * 60;
const cs = Math.cos(yaw), sn = Math.sin(yaw);
const rot = (p) => { const x = p[0] - cx0, y = p[1] - cy0; return [x * cs - y * sn, x * sn + y * cs]; };
const iso = (p, z) => { const r = rot(p); return [ox + (r[0] - r[1]) * 0.866 * S, oy + (r[0] + r[1]) * 0.5 * S - z]; };
const f = (n) => n.toFixed(1);
const poly = (pts) => 'M' + pts.map((q) => f(q[0]) + ' ' + f(q[1])).join('L') + 'Z';
const shapes = [];
const slabCorners = (p, q, w) => {
const L = Math.hypot(q[0] - p[0], q[1] - p[1]); const ux = (q[0] - p[0]) / L, uy = (q[1] - p[1]) / L; const nx = -uy, ny = ux;
const hw = w / 2;
return [[p[0] - ux * hw + nx * hw, p[1] - uy * hw + ny * hw], [q[0] + ux * hw + nx * hw, q[1] + uy * hw + ny * hw], [q[0] + ux * hw - nx * hw, q[1] + uy * hw - ny * hw], [p[0] - ux * hw - nx * hw, p[1] - uy * hw - ny * hw]];
};
const addSlab = (corners, z, thk, top, side, plate) => {
const bots = corners.map((c) => iso(c, z)); const tops = corners.map((c) => iso(c, z + thk));
const quads = [];
for (let i = 0; i < 4; i++) { const j = (i + 1) % 4; quads.push({ pts: [bots[i], bots[j], tops[j], tops[i]], depth: (bots[i][1] + bots[j][1]) / 2 }); }
quads.sort((m, n) => m.depth - n.depth);
quads.forEach((qd) => shapes.push({ d: poly(qd.pts), fill: side, stroke: C.line, sw: 1, op: 1 }));
shapes.push({ d: poly(tops), fill: top, stroke: C.line, sw: 1.2, op: 1 });
};
const ring = (p, z, r, color) => {
const c = iso(p, z); const rx = r * S * 1.22, ry = r * S * 0.71;
shapes.push({ d: 'M' + f(c[0] - rx) + ' ' + f(c[1]) + 'A' + f(rx) + ' ' + f(ry) + ' 0 1 0 ' + f(c[0] + rx) + ' ' + f(c[1]) + 'A' + f(rx) + ' ' + f(ry) + ' 0 1 0 ' + f(c[0] - rx) + ' ' + f(c[1]) + 'Z', fill: 'none', stroke: color, sw: 1.3, op: 1 });
};
const pin = (p, z0, z1) => {
if (z1 - z0 < 3) return;
const a0 = iso(p, z0), a1 = iso(p, z1);
shapes.push({ d: 'M' + f(a0[0]) + ' ' + f(a0[1]) + 'L' + f(a1[0]) + ' ' + f(a1[1]), fill: 'none', stroke: C.line, sw: 3, op: 1 });
};
const gap = 14 + e * 84, thk = 8, base = 6;
const z1 = base + gap, z2 = base + 2 * gap;
// soft ground shadow
const sh = iso([cx0, cy0], -14);
shapes.push({ d: 'M' + f(sh[0] - 300) + ' ' + f(sh[1]) + 'A300 90 0 1 0 ' + f(sh[0] + 300) + ' ' + f(sh[1]) + 'A300 90 0 1 0 ' + f(sh[0] - 300) + ' ' + f(sh[1]) + 'Z', fill: C.shadow, stroke: 'none', sw: 0, op: C.sop });
// base plate
addSlab([[-22, -26], [148, -26], [148, 100], [-22, 100]], 0, base, C.plate, C.plateSide, true);
[A, D, B, Cj].forEach((j) => ring(j, base, 3.6, C.muted));
// layer 1: crank + rocker
pin(A, base, z1 + thk); pin(D, base, z1 + thk);
addSlab(slabCorners(A, B, 14), z1, thk, FOLD, FOLDSIDE);
addSlab(slabCorners(D, Cj, 14), z1, thk, C.top, C.side);
ring(A, z1 + thk, 3.6, C.line); ring(D, z1 + thk, 3.6, C.line); ring(B, z1 + thk, 3.6, C.line); ring(Cj, z1 + thk, 3.6, C.line);
// layer 2: coupler
pin(B, z1 + thk, z2 + thk); pin(Cj, z1 + thk, z2 + thk);
addSlab(slabCorners(B, Cj, 14), z2, thk, C.top, C.side);
ring(B, z2 + thk, 3.6, C.line); ring(Cj, z2 + thk, 3.6, C.line);
// labels: attached to the parts, fade in as the mechanism opens
const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
const defs = [
{ name: 'ground', value: '100.0 mm', at: mid(A, D), z: base, side: 'L', dy: 36 },
{ name: 'crank', value: '40.0 mm', at: mid(A, B), z: z1 + thk, side: 'L', dy: 0 },
{ name: 'coupler', value: '120.0 mm', at: mid(B, Cj), z: z2 + thk, side: 'R', dy: -30 },
{ name: 'rocker', value: '90.0 mm', at: mid(D, Cj), z: z1 + thk, side: 'R', dy: 20 }
];
const op = this.props.showLabels === false ? 0 : Math.min(1, Math.max(0, (e - 0.25) / 0.5));
const labels = defs.map((q) => {
const p = iso(q.at, q.z); const left = q.side === 'L'; const tx = left ? 24 : 876; const ty = p[1] + q.dy;
const elbow = left ? tx + 120 : tx - 120;
return { name: q.name, value: q.value, px: f(p[0]), py: f(p[1]), tx: f(tx), ty: f(ty - 6), ty2: f(ty + 12), anchor: left ? 'start' : 'end', op: op, ink: C.ink, muted: C.muted,
line: 'M' + f(p[0]) + ' ' + f(p[1]) + 'L' + f(elbow) + ' ' + f(ty) };
});
return { shapes, labels };
}
}
</script>
</body>
</html>
